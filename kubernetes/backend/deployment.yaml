apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-backend
  labels:
    app: expense-tracker-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: expense-tracker-backend
  template:
    metadata:
      labels:
        app: expense-tracker-backend
    spec:
      containers:
        - name: backend
          image: fidelii2004/expense-tracker-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: database-url

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-secrets
                  key: jwt-secret-key

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
