apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: expense-tracker-alerts
        rules:
          - alert: ExpenseTrackerBackendDown
            expr: up{job="expense-tracker-backend"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Expense Tracker backend is down"
              description: "Prometheus cannot scrape a backend target."

          - alert: ExpenseTrackerHighErrorRate
            expr: |
              (
                sum(rate(expense_tracker_http_requests_total{status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(expense_tracker_http_requests_total[5m])), 0.000001)
              ) > 0.05
              and
              sum(rate(expense_tracker_http_requests_total[5m])) > 0.1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Expense Tracker has a high error rate"
              description: "HTTP 5xx error rate exceeds 5%."

          - alert: ExpenseTrackerSlowResponses
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(expense_tracker_http_request_duration_seconds_bucket[5m])
                )
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Expense Tracker responses are slow"
              description: "95th percentile response time exceeds 2 seconds."

          - alert: ExpenseTrackerNoBackendTargets
            expr: absent(up{job="expense-tracker-backend"})
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "No Expense Tracker backend targets discovered"
              description: "Prometheus has discovered no backend targets."
