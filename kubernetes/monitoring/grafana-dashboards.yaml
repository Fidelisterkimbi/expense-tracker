apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  provider.yaml: "apiVersion: 1\nproviders:\n- name: Expense Tracker\n  orgId: 1\n\
    \  folder: Expense Tracker\n  type: file\n  disableDeletion: true\n  editable:\
    \ false\n  options:\n    path: /etc/grafana/provisioning/dashboards/json\n"
  dashboard.json: "{\n  \"uid\": \"expense-tracker\",\n  \"title\": \"Expense Tracker\
    \ - Application Monitoring\",\n  \"tags\": [\n    \"expense-tracker\",\n    \"\
    devops\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\"\
    : 1,\n  \"refresh\": \"15s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"\
    to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\"\
    : \"HTTP Requests per Second\",\n      \"type\": \"timeseries\",\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"\
    x\": 0,\n        \"y\": 0\n      },\n      \"targets\": [\n        {\n       \
    \   \"expr\": \"sum(rate(expense_tracker_http_requests_total[5m]))\",\n      \
    \    \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n       \
    \ \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\"\
    : []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\"\
    : \"list\",\n          \"placement\": \"bottom\"\n        }\n      }\n    },\n\
    \    {\n      \"id\": 2,\n      \"title\": \"HTTP Error Rate (%)\",\n      \"\
    type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"\
    h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"100 * sum(rate(expense_tracker_http_requests_total{status=~\\\
    \"5..\\\"}[5m])) / clamp_min(sum(rate(expense_tracker_http_requests_total[5m])),\
    \ 0.000001)\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"percent\"\n        },\n  \
    \      \"overrides\": []\n      },\n      \"options\": {\n        \"legend\":\
    \ {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\
    \n        }\n      }\n    },\n    {\n      \"id\": 3,\n      \"title\": \"95th\
    \ Percentile Response Time\",\n      \"type\": \"timeseries\",\n      \"datasource\"\
    : {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n    \
    \  },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"\
    x\": 0,\n        \"y\": 8\n      },\n      \"targets\": [\n        {\n       \
    \   \"expr\": \"histogram_quantile(0.95, sum by (le) (rate(expense_tracker_http_request_duration_seconds_bucket[5m])))\"\
    ,\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\"\
    : []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\"\
    : \"list\",\n          \"placement\": \"bottom\"\n        }\n      }\n    },\n\
    \    {\n      \"id\": 4,\n      \"title\": \"Requests by HTTP Status\",\n    \
    \  \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\"\
    ,\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"\
    h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n\
    \      \"targets\": [\n        {\n          \"expr\": \"sum by (status) (rate(expense_tracker_http_requests_total[5m]))\"\
    ,\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n\
    \        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"\
    overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n     \
    \     \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n      \
    \  }\n      }\n    }\n  ]\n}\n"
