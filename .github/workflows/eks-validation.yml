name: EKS candidate validation

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/eks-validation.yml'
  push:
    branches: ['codex/eks-deployment']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.0'
      - name: Validate EKS infrastructure
        run: |
          terraform -chdir=terraform/environments/eks init -backend=false -input=false
          terraform -chdir=terraform/environments/eks validate
          terraform fmt -check -recursive terraform
      - name: Validate Python and candidate manifests
        run: |
          python -m py_compile scripts/finish_eks.py backend/app.py backend/test_app.py
          python -m unittest discover -s tests -v
          python -m pip install PyYAML
          python - <<'PY'
          import pathlib, yaml
          for path in pathlib.Path('kubernetes').rglob('*.yaml'):
              list(yaml.safe_load_all(path.read_text()))
          PY
      - name: Build and test backend
        run: |
          docker build -t expense-tracker-backend:ci backend
          docker run --rm --entrypoint sh expense-tracker-backend:ci \
            -c 'mkdir -p "$PROMETHEUS_MULTIPROC_DIR" && python -m unittest discover -s /app -p test_app.py -v'
      - name: Validate frontend with Kubernetes routing
        run: |
          docker build -t expense-tracker-frontend:ci frontend
          python - <<'PY'
          import pathlib, yaml
          config = yaml.safe_load(pathlib.Path('kubernetes/frontend/nginx-configmap.yaml').read_text())
          pathlib.Path('/tmp/eks-nginx.conf').write_text(config['data']['default.conf'])
          PY
          docker run --rm --add-host expense-tracker-backend:127.0.0.1 \
            -v /tmp/eks-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
            --entrypoint nginx expense-tracker-frontend:ci -t
