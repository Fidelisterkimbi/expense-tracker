name: Expense Tracker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'ENVEOF'
          POSTGRES_DB=expense_tracker
          POSTGRES_USER=expense_user
          POSTGRES_PASSWORD=ci_test_password
          JWT_SECRET_KEY=ci_test_jwt_secret
          ENVEOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for containers..."
          sleep 20
          docker compose ps

      - name: Test frontend
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://127.0.0.1/

      - name: Test API
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://127.0.0.1/api/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "GitHub runner IP detected."

      - name: Temporarily allow SSH from GitHub runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-093d2e618f18ef461 \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32"

      - name: Configure deployment SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'REMOTE'
              set -e

              cd ~/expense-tracker

              git fetch origin main
              git reset --hard origin/main

              sudo docker compose config --quiet
              sudo docker compose up -d --build

              echo "Waiting for application..."
              sleep 20

              sudo docker compose ps

              curl --fail --retry 5 --retry-delay 5 \
                http://127.0.0.1/

              curl --fail --retry 5 --retry-delay 5 \
                http://127.0.0.1/api/

              echo "Deployment successful."
          REMOTE

      - name: Remove temporary SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-093d2e618f18ef461 \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32" \
            || true
