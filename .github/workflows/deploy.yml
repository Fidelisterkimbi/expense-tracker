name: Expense Tracker CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'ENVEOF'
          POSTGRES_DB=expense_tracker
          POSTGRES_USER=expense_user
          POSTGRES_PASSWORD=ci_test_password
          JWT_SECRET_KEY=ci_test_jwt_secret
          ENVEOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --pull

      - name: Run backend tests
        run: |
          docker compose run --rm --no-deps --entrypoint sh backend -c 'mkdir -p "$PROMETHEUS_MULTIPROC_DIR" && python -m unittest discover -s /app -p test_app.py -v'

      - name: Scan Docker images with Trivy
        run: |
          set -e
          docker image inspect expense-tracker-backend:latest
          docker image inspect expense-tracker-frontend:latest

          for image in \
            expense-tracker-backend:latest \
            expense-tracker-frontend:latest
          do
            echo "Scanning $image"

            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3 image \
              --image-src docker \
              --scanners vuln \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              "$image"
          done

      - name: Start application
        run: docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for containers..."
          sleep 20
          docker compose ps

      - name: Test frontend
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://127.0.0.1/

      - name: Test API
        run: |
          curl --fail --retry 5 --retry-delay 5 \
            http://127.0.0.1/api/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to EC2
    concurrency:
      group: expense-tracker-production
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get GitHub runner public IP
        id: runner-ip
        run: |
          RUNNER_IP=$(curl -fsSL https://checkip.amazonaws.com | tr -d '\n')
          echo "ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "GitHub runner IP detected."

      - name: Temporarily allow SSH from GitHub runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id sg-093d2e618f18ef461 \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32"

      - name: Configure deployment SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/ec2_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
              set -e

              cd ~/expense-tracker

              deploy_sha="$1"
              git fetch origin "$deploy_sha"
              test "$(git rev-parse FETCH_HEAD)" = "$deploy_sha"
              git reset --hard "$deploy_sha"

              sudo docker compose config --quiet
              sudo docker compose up -d --build

              echo "Waiting for application..."
              sleep 20

              sudo docker compose ps

              curl --fail --retry 5 --retry-delay 5 \
                http://127.0.0.1/

              curl --fail --retry 5 --retry-delay 5 \
                http://127.0.0.1/api/

              echo "Deployment successful."
          REMOTE

      - name: Remove temporary SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-093d2e618f18ef461 \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ip }}/32" \
            || true
